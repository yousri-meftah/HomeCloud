version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: homecloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homecloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homecloud}
      POSTGRES_DB: ${POSTGRES_DB:-homecloud}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homecloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: homecloud-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: homecloud-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - backend/envs/.env.database
      - backend/envs/.env.proxmox
      - backend/envs/.env.cloudflare
      - backend/envs/.env.stripe
      - backend/envs/.env.email
      - backend/envs/.env.monitoring

volumes:
  postgres_data:
  elasticsearch_data:
